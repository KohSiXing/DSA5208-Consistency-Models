services:
  mongo1:
    image: mongo:8.3
    container_name: mongo1
    command: mongod --replSet dsa5208 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "127.0.0.2:27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo1_data:/data/db
    networks:
      - mongo-cluster

  mongo2:
    image: mongo:8.3
    container_name: mongo2
    command: mongod --replSet dsa5208 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "127.0.0.3:27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo2_data:/data/db
    networks:
      - mongo-cluster

  mongo3:
    image: mongo:8.3
    container_name: mongo3
    command: mongod --replSet dsa5208 --bind_ip_all --setParameter enableTestCommands=1
    ports:
      - "127.0.0.4:27017:27017"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mongo3_data:/data/db
    networks:
      - mongo-cluster

networks:
  mongo-cluster:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: